      background-position:center top;
      filter:brightness(0.35) blur(2px);
      z-index:0;

      position:fixed;
      inset:0;
      background:radial-gradient(ellipse at center, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.7) 100%);
      z-index:1;
    }
    canvas{
      position:relative;
      z-index:2;
      display:block;
    }
    #title{
      position:relative;
      z-index:3;
      color:#fff;
      font-family:'Dancing Script',cursive;
      font-size:clamp(18px,3vw,28px);
      letter-spacing:6px;
      margin-top:12px;
      opacity:0;
      animation:fadeUp 2s ease 1.5s forwards;
      text-shadow:0 0 20px rgba(255,105,180,0.9), 0 0 40px rgba(255,105,180,0.5);
    }
    #subtitle{
      position:relative;
      z-index:3;
      color:rgba(255,182,193,0.85);
      font-family:'Satisfy',cursive;
      font-size:clamp(13px,2vw,17px);
      letter-spacing:3px;
      margin-top:8px;
      opacity:0;
      animation:fadeUp 2s ease 2.2s forwards;
    }
    @keyframes fadeUp{
      from{opacity:0;transform:translateY(12px)}
      to{opacity:1;transform:translateY(0)}
    }
    #music-btn{
      position:fixed;
      bottom:20px;
      right:20px;
      z-index:10;
      background:rgba(255,105,180,0.2);
      border:1.5px solid rgba(255,105,180,0.5);
      border-radius:50%;
      width:48px;height:48px;
      cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      font-size:22px;
      transition:all 0.3s;
      backdrop-filter:blur(8px);
    }
    #music-btn:hover{background:rgba(255,105,180,0.4);}
  </style>
</head>
<body>
  <div id="bg"></div>
  <div id="overlay"></div>
  <canvas id="c"></canvas>
  <div id="title">✦ I Love You ✦</div>
  <div id="subtitle">Mãi mãi bên nhau 💕</div>
  <div id="music-btn" onclick="toggleMusic()" title="Nhạc">🎵</div>

  <audio id="music" loop>
    <source src="https://www.bensound.com/bensound-music/bensound-romantic.mp3" type="audio/mpeg"/>
  </audio>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    function resize(){
      const w = Math.min(window.innerWidth, 800);
      const h = Math.min(window.innerHeight * 0.72, 560);
      canvas.width = w;
      canvas.height = h;
    }
    resize();
    window.addEventListener('resize', resize);

    function hx(t){ return 16*Math.pow(Math.sin(t),3); }
    function hy(t){ return -(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t)); }

    const WORDS = ['I Love You','Love You','I ❤ You','Yêu em','Mãi yêu'];
    const N = 280;
    const pts = [];
    for(let i=0;i<N;i++){
      const t=(i/N)*Math.PI*2;
      pts.push({
        t,
        label: WORDS[Math.floor(Math.random()*WORDS.length)],
        phase: Math.random()*Math.PI*2,
        speed: 0.025+Math.random()*0.015,
        size: 10+Math.random()*7,
        rot: (Math.random()-0.5)*0.4,
        rotSpeed: (Math.random()-0.5)*0.006,
        curRot: Math.random()*Math.PI*2,
      });
    }

    let frame=0;
    function draw(){
      const W=canvas.width, H=canvas.height;
      ctx.clearRect(0,0,W,H);

      const pulse = 1 + 0.04*Math.sin(frame*0.035);
      const scale = (W/58)*pulse;
      const cx=W/2, cy=H/2+10;

      pts.forEach((p,i)=>{
        const x = cx + hx(p.t)*scale;
        const y = cy + hy(p.t)*scale;

        p.curRot += p.rotSpeed;
        const alpha = 0.6 + 0.4*Math.sin(frame*p.speed + p.phase);
        const sz = p.size * (0.9 + 0.1*Math.sin(frame*0.04+i));

        ctx.save();
        ctx.translate(x,y);
        ctx.rotate(p.curRot);

        // glow
        ctx.shadowColor = 'rgba(255,60,140,0.9)';
        ctx.shadowBlur = 14;

        // gradient text color
        const r = 255;
        const g = Math.floor(80 + 60*Math.sin(frame*0.02+i*0.1));
        const b = Math.floor(160 + 60*Math.cos(frame*0.015+i*0.08));
        ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
        ctx.font = `bold ${sz}px 'Dancing Script', cursive`;
        ctx.textAlign = 'center';
        ctx.fillText(p.label, 0, 0);

        ctx.restore();
      });

      frame++;
      requestAnimationFrame(draw);
    }
    draw();

    // music
    let playing=false;
    const audio=document.getElementById('music');
    function toggleMusic(){
      if(playing){ audio.pause(); document.getElementById('music-btn').textContent='🎵'; }
      else{ audio.play(); document.getElementById('music-btn').textContent='🔇'; }
      playing=!playing;
    }
    // auto play on click anywhere
    document.body.addEventListener('click', function once(){
      if(!playing) toggleMusic();
      document.body.removeEventListener('click', once);
    });
  </script>
</body>
</html>
